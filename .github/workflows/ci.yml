name: Hospital Management System CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build API Gateway
        working-directory: backend/api-gateway
        run: mvn -B -ntp clean package -DskipTests

      - name: Build Auth Service
        working-directory: backend/auth-service
        run: mvn -B -ntp clean package -DskipTests

      - name: Build Patient Service
        working-directory: backend/patient-service
        run: mvn -B -ntp clean package -DskipTests

      - name: Build Doctor Service
        working-directory: backend/doctor-service
        run: mvn -B -ntp clean package -DskipTests

      - name: Build Appointment Service
        working-directory: backend/appointment-service
        run: mvn -B -ntp clean package -DskipTests

      - name: Build Eureka Server
        working-directory: backend/discovery-server-Eureka
        run: mvn -B -ntp clean package -DskipTests

      - name: Build Config Server
        working-directory: backend/config server
        run: mvn -B -ntp clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build API Gateway Docker Image
        working-directory: backend/api-gateway
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/hospital-api-gateway:latest .

      - name: Push API Gateway Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/hospital-api-gateway:latest

      - name: Build Auth Docker Image
        working-directory: backend/auth-service
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/hospital-auth-service:latest .

      - name: Push Auth Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/hospital-auth-service:latest

      - name: Build Patient Docker Image
        working-directory: backend/patient-service
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/hospital-patient-service:latest .

      - name: Push Patient Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/hospital-patient-service:latest

      - name: Build Doctor Docker Image
        working-directory: backend/doctor-service
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/hospital-doctor-service:latest .

      - name: Push Doctor Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/hospital-doctor-service:latest

      - name: Build Appointment Docker Image
        working-directory: backend/appointment-service
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/hospital-appointment-service:latest .

      - name: Push Appointment Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/hospital-appointment-service:latest

      - name: Build Eureka Docker Image
        working-directory: backend/discovery-server-Eureka
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/hospital-discovery-server:latest .

      - name: Push Eureka Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/hospital-discovery-server:latest

      - name: Build Config Server Docker Image
        working-directory: backend/config server
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/hospital-config-server:latest .

      - name: Push Config Server Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/hospital-config-server:latest